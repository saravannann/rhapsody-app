name: WhatsApp Broadcast

on:
  schedule:
    # Example: Runs at 09:00 UTC every day.
    # Change this cron to your preferred time or comment it out if you only want manual runs.
    - cron: '30 3 * * *' # 9:00 AM IST (3:30 AM UTC)
  
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment (TEST or PROD)'
        required: true
        default: 'PROD'
        type: choice
        options:
          - TEST
          - PROD
      template_name:
        description: 'WhatsApp Template Name'
        required: true
        default: 'rhapsody_invite'
      file_path:
        description: 'Path to contact file (relative to repo root)'
        required: true
        default: 'phone_numbers_v1.txt'

jobs:
  broadcast:
    runs-on: ubuntu-latest
    # Increase timeout for long-running broadcasts (400 numbers * 10s = ~67 mins)
    timeout-minutes: 120 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Broadcast Script
        env:
          WHATSAPP_TEST_TOKEN: ${{ secrets.WHATSAPP_TEST_TOKEN }}
          WHATSAPP_PROD_TOKEN: ${{ secrets.WHATSAPP_PROD_TOKEN }}
        run: |
          # Use manual inputs if available (workflow_dispatch), 
          # otherwise use defaults for scheduled runs.
          
          ENV=${{ github.event.inputs.environment || 'PROD' }}
          TEMPLATE=${{ github.event.inputs.template_name || 'rhapsody_invite' }}
          FILE=${{ github.event.inputs.file_path || 'phone_numbers_v1.txt' }}
          
          echo "Starting broadcast for $ENV using template $TEMPLATE with file $FILE"
          python PN_1Arg.py "$ENV" "$TEMPLATE" "$FILE"
